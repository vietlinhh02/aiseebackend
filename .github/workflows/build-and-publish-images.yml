name: Build And Publish Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Backend And Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend tests
        run: go test ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Run agent tests
        working-directory: agent_worker
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e . pytest anyio
          .venv/bin/python -m pytest tests/test_schemas.py tests/test_tool_router.py tests/test_gemini_session_events.py

  publish-images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: ./Dockerfile
            image_suffix: aiseebackend
          - service: agent
            context: ./agent_worker
            dockerfile: ./agent_worker/Dockerfile
            image_suffix: aiseebackend-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.image }}:main
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

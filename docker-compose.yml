services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aisee
      POSTGRES_PASSWORD: aisee
      POSTGRES_DB: aisee
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
    env_file: .env
    environment:
      - DATABASE_URL=postgres://aisee:aisee@postgres:5432/aisee?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=aisee
      - S3_USE_SSL=false

  agent:
    build: ./agent_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GO_BACKEND_URL=${GO_BACKEND_URL:-http://host.docker.internal:8080/api/internal}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-live-preview}

volumes:
  pgdata:
  minio_data:

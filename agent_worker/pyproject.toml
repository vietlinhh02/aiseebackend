[project]
name = "aisee-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[images]~=1.0",
    "google-genai>=1.69.0",
    "httpx>=0.27.0",
    "websockets>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]

line-length = 100
